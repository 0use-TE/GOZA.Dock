name: Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Install wasm workload
        run: dotnet workload install wasm-tools

      - name: Build docs
        run: docfx docfx.json

      - name: Publish WASM demo
        run: dotnet publish samples/GOZA.Dock.Demo.Browser/GOZA.Dock.Demo.Browser.csproj -c Release

      - name: Merge WASM demo into site
        run: |
          mkdir -p _site/demo
          cp -r samples/GOZA.Dock.Demo.Browser/bin/Release/net10.0-browser/publish/wwwroot/. _site/demo/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
