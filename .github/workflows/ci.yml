name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore library and tests
        run: dotnet restore GOZA.Dock.Tests.slnx
      - name: Unit and headless tests
        run: dotnet test GOZA.Dock.Tests.slnx -c Release --no-restore --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Mobile samples require platform toolchains; the library/test build does not.
      - name: Build desktop samples
        run: |
          dotnet build samples/GOZA.Dock.Minimal.Desktop/GOZA.Dock.Minimal.Desktop.csproj -c Release
          dotnet build samples/GOZA.Dock.Demo.Desktop/GOZA.Dock.Demo.Desktop.csproj -c Release
      - name: Pack library
        run: dotnet pack src/GOZA.Dock/GOZA.Dock.csproj -c Release -o ./artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
