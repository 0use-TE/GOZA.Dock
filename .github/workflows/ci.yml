name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GOZA.Dock.slnx

      - name: Build
        run: dotnet build GOZA.Dock.slnx -c Release --no-restore

      - name: Pack library
        run: dotnet pack src/GOZA.Dock/GOZA.Dock.csproj -c Release -o ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
