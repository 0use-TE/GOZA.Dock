name: Release Desktop

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Demo Desktop (win-x64 AOT)
        run: dotnet publish samples/GOZA.Dock.Demo.Desktop/GOZA.Dock.Demo.Desktop.csproj -c Release -r win-x64 --self-contained

      - name: Zip publish output
        shell: pwsh
        run: |
          $src = "samples/GOZA.Dock.Demo.Desktop/bin/Release/net10.0/win-x64/publish"
          $zip = "GOZA.Dock.Demo.Desktop-win-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: GOZA.Dock.Demo.Desktop-win-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GOZA.Dock.Demo.Desktop-win-x64
          path: GOZA.Dock.Demo.Desktop-win-x64.zip
